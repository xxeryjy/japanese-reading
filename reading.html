<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#1e3a5f">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="日语阅读">
<link rel="apple-touch-icon" sizes="180x180" href="icon-180.png">
<title>阅读目录｜日语初级阅读</title>
<link rel="stylesheet" href="tokens.css">
<link rel="stylesheet" href="wabi.css">
<script>try{var t=localStorage.getItem("jr_theme");if(t==="wabi")document.documentElement.setAttribute("data-theme","wabi");}catch(e){}</script>
<style>
/* 本页只写布局与组件：颜色 / 字体 / 字号 / 间距 / 圆角全部来自 tokens.css（全站唯一真源）。
   篇色只出现在印章一处（R5 位置①）；卡片一律 1px --line + 留白分层，无投影（R6）。 */
*,*::before,*::after{box-sizing:border-box;}
body{
  margin:0;
  background:var(--paper);
  color:var(--ink);
  font-family:var(--font-zh);
  font-size:15px;
  line-height:1.8;
  padding:env(safe-area-inset-top,0px) var(--s4) calc(var(--s10) + env(safe-area-inset-bottom,0px));
}
.wrap{max-width:560px;margin:0 auto;}
:focus-visible{outline:2px solid var(--brand);outline-offset:2px;}

header{display:flex;align-items:center;gap:var(--s3);margin-bottom:var(--s4);}
.back{
  display:inline-flex;align-items:center;
  min-height:36px;padding:0 var(--s3);
  border:1px solid var(--line-control);border-radius:var(--r-pill);
  background:var(--card);color:var(--text-soft);font-size:13px;text-decoration:none;
}
.title{font-size:15px;font-weight:700;letter-spacing:.04em;}
.hint{margin:0 2px var(--s4);font-size:13px;color:var(--text-soft);}

.card{
  display:block;margin-bottom:var(--s3);padding:var(--s5);
  background:var(--card);border:1px solid var(--line);border-radius:var(--r-card);
  color:inherit;text-decoration:none;
}
.card:active{transform:scale(.99);}

/* 编号印章：R5 位置①（28×28 篇色实底 + 白字） */
.stamp-row{display:flex;align-items:center;gap:var(--s2);}
.stamp{
  flex:none;display:flex;align-items:center;justify-content:center;
  width:28px;height:28px;border-radius:var(--r-tag);
  background:var(--piece);color:var(--on-fill);
  font-size:12px;font-weight:700;font-variant-numeric:tabular-nums;letter-spacing:.02em;
}
.cat{font-size:12px;font-weight:600;color:var(--text-muted);}

.t-ja{margin-top:var(--s3);font-family:var(--font-ja);font-size:21px;font-weight:700;line-height:1.5;}
.t-zh{margin-top:2px;font-size:13px;color:var(--text-soft);}
.desc{margin:var(--s3) 0 0;font-size:14px;line-height:1.75;color:var(--text-soft);}
.tags{display:flex;gap:var(--s1);flex-wrap:wrap;margin-top:var(--s3);}
.tags span{padding:2px var(--s2);border-radius:var(--r-pill);background:var(--inset);color:var(--text-soft);font-size:12px;}

@media (max-width:380px){
  body{padding-left:var(--s3);padding-right:var(--s3);}
  .card{padding:var(--s4);}
  .t-ja{font-size:19px;}
}
@media (prefers-reduced-motion:reduce){
  .card:active{transform:none;}
}
</style>
</head>
<body class="pg-catalog">
<div class="wrap">
  <header>
    <a class="back" href="index.html">← 首页</a>
    <div class="title" id="pageTitle">阅读目录</div>
  </header>
  <p class="hint">按顺序读最顺；每篇都配假名注音、逐句中译和单句朗读。</p>

  <div id="cards"></div>
</div>
<script src="content.js"></script>
<script>
/* 阅读目录：卡片全部由 content.js 派生。加文章时只需在 content.js 的 articles 加一条，这里自动多一张卡。 */
(function(){
  const A = window.APP_DATA.articles;
  document.getElementById('pageTitle').textContent = A.length + ' 篇阅读';
  document.title = A.length + ' 篇阅读｜日语初级阅读';
  const esc = s => String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;');
  document.getElementById('cards').innerHTML = A.map(function(a){
    return '<a class="card" href="'+esc(a.file)+'" data-piece="'+esc(a.id)+'">'+
      '<div class="stamp-row"><span class="stamp">'+esc(a.no)+'</span><span class="cat">'+esc(a.cat)+'</span></div>'+
      '<div class="t-ja" lang="ja">'+esc(a.ja)+'</div>'+
      '<div class="t-zh" lang="zh-CN">'+esc(a.zh)+'</div>'+
      '<p class="desc">'+esc(a.desc)+'</p>'+
      '<div class="tags"><span>'+a.sentCount+' 句</span><span>'+esc(a.grammarTag)+'</span><span>约 3 分钟</span></div>'+
    '</a>';
  }).join('');
})();
</script>
<script src="theme.js"></script>
</body>
</html>
