<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#E8E2D6">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="日语阅读">
<link rel="apple-touch-icon" sizes="180x180" href="icon-180.png">
<title>复习模式｜日语初级阅读</title>
<link rel="stylesheet" href="tokens.css">
<link rel="stylesheet" href="layout.css">
<style>
/* 本页只写布局与组件：颜色 / 字体 / 字号 / 间距 / 圆角全部来自 tokens.css（全站唯一真源）。
   R1 本页只有 1 个 --brand 实底 = 今日卡里的「开始今日复习」，其余按钮一律 brand 描边 + 字色。
   R2 危险动作只用 --no 文字/描边，永不做实底。R6 本页投影只出现在翻转词卡 .face。 */
*,*::before,*::after{box-sizing:border-box;}
html{-webkit-text-size-adjust:100%;}
body{
  margin:0;
  min-height:100vh;
  min-height:100dvh;   /* 关键：移动端 100vh 大于可见高（dvh），会凭空多出 ~60–90px 可滚高度，答题页就"能滚"了 */
  background:var(--paper);
  color:var(--ink);
  font-family:var(--font-zh);
  font-size:15px;
  line-height:1.7;
  padding:env(safe-area-inset-top,0px) 0 calc(var(--s14) + env(safe-area-inset-bottom,0px));
}
.wrap{max-width:560px;margin:0 auto;padding:var(--s4) var(--s4) 0;}
:focus-visible{outline:2px solid var(--brand);outline-offset:2px;}
.sr{position:absolute;width:1px;height:1px;margin:-1px;padding:0;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap;border:0;}

/* ---------- 页头 ---------- */
.hdr{display:flex;align-items:center;gap:var(--s3);min-height:44px;margin-bottom:var(--s3);}
.back{
  flex:none;display:inline-flex;align-items:center;justify-content:center;
  width:44px;height:44px;border-radius:var(--r-pill);
  border:1px solid var(--line);background:var(--card);
  color:var(--text-soft);font-size:18px;line-height:1;text-decoration:none;
}
.back:active{background:var(--inset);}
.title{font-size:15px;font-weight:700;letter-spacing:.04em;color:var(--ink);}

/* ---------- ① 状态行：整行可点，透明底无边框 ---------- */
.statusbar{
  display:flex;align-items:center;gap:var(--s2);
  width:100%;min-height:44px;padding:0 var(--s2);
  background:none;border:0;border-radius:var(--r-ctl);
  font-family:var(--font-zh);font-size:12.5px;color:var(--text-soft);
  text-align:left;cursor:pointer;
}
.statusbar:active{background:var(--inset);}
.ab-dot{flex:none;width:8px;height:8px;border-radius:50%;background:transparent;}
.ab-dot.on{background:var(--text-muted);}      /* 未登录：实心灰 */
.ab-dot.err{background:var(--no);}             /* 同步失败：实心红 */
.stxt{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
.sact{flex:none;font-weight:600;color:var(--brand);}
.statusbar .chev{flex:none;}

/* 账户面板：原位展开，不是弹层 */
.acct{
  margin:var(--s1) 0 var(--s3);padding:var(--s3) var(--s4);
  background:var(--fill);border:1px solid var(--line);border-radius:var(--r-card);
}
.acct-who{font-size:12.5px;color:var(--text-soft);}
/* 两列网格，不是 flex-wrap：flex 在微信里被放大字号后，输入框的 min-content
   会把「获取验证码」挤出屏幕右边（真机上截断按钮）。网格的 1fr 列永远让位给按钮。 */
.ab-phone{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:var(--s2);margin-top:var(--s2);}
.ab-phone input{
  width:100%;min-width:0;height:44px;padding:0 var(--s3);
  border:1px solid var(--line);border-radius:var(--r-ctl);
  background:var(--card);color:var(--ink);font-family:inherit;font-size:14px;
}
.ab-phone button{
  height:44px;padding:0 var(--s3);white-space:nowrap;
  border:1px solid var(--line);border-radius:var(--r-ctl);
  background:var(--card);color:var(--ink);font-family:inherit;font-size:13px;font-weight:600;cursor:pointer;
}
.ab-phone button#btnVerify{border-color:var(--brand);color:var(--brand);}
.ab-phone button:active{background:var(--inset);}
.ab-err{display:none;margin-top:var(--s2);font-size:12.5px;}
.ab-err.ok{display:block;color:var(--ok);}
.ab-err.bad{display:block;color:var(--no);}
.ab-out{
  display:none;margin-top:var(--s2);min-height:44px;padding:0 var(--s2);
  background:none;border:0;border-radius:var(--r-ctl);
  color:var(--text-soft);font-family:inherit;font-size:13px;cursor:pointer;
}
.ab-out:active{background:var(--inset);}

/* ---------- ② 今日卡：本页唯一白卡，唯一 --brand 实底 ---------- */
.today{
  margin-top:var(--s3);padding:var(--s5);
  background:var(--card);border:1px solid var(--line);border-radius:var(--r-card);
}
.t-kicker{font-size:12px;font-weight:600;letter-spacing:.08em;color:var(--text-muted);}
.t-big{display:flex;align-items:baseline;gap:var(--s2);margin-top:var(--s1);}
.t-big b{
  font-size:40px;font-weight:700;line-height:1.1;color:var(--brand);
  font-variant-numeric:tabular-nums;
}
.t-big span{font-size:15px;font-weight:600;color:var(--text-soft);}
.t-sub{margin-top:var(--s1);font-size:12.5px;color:var(--text-soft);}
.t-prog{margin-top:var(--s3);}
.t-prog-row{display:flex;justify-content:space-between;gap:var(--s2);font-size:12.5px;color:var(--text-soft);}
.t-prog-row b{font-weight:600;color:var(--ink);font-variant-numeric:tabular-nums;}
.bar{height:4px;background:var(--line);border-radius:var(--r-pill);overflow:hidden;}
.bar i{display:block;height:100%;width:0;background:var(--ink);border-radius:var(--r-pill);transition:width .25s;}
.t-prog .bar{margin-top:var(--s2);}
.t-btn{
  display:flex;align-items:center;justify-content:center;gap:var(--s2);
  width:100%;height:52px;margin-top:var(--s4);
  background:var(--brand);color:var(--on-fill);
  border:0;border-radius:var(--r-ctl);
  font-family:inherit;font-size:16px;font-weight:600;cursor:pointer;
}
.t-btn:active{background:var(--brand-press);}
.t-btn .b-n{
  padding:1px var(--s2);border-radius:var(--r-pill);
  background:var(--brand-tint);color:var(--brand);
  font-size:12px;font-weight:600;font-variant-numeric:tabular-nums;
}
.t-btn .b-n:empty{display:none;}

/* ---------- ③ 只练没掌握的 ---------- */
.rowbtn{
  display:flex;align-items:center;justify-content:space-between;gap:var(--s3);
  width:100%;min-height:48px;margin-top:var(--s2);padding:0 var(--s2);
  background:none;border:0;border-radius:var(--r-ctl);
  color:var(--brand);font-family:inherit;font-size:14.5px;font-weight:600;
  text-align:left;cursor:pointer;
}
.rowbtn:active{background:var(--inset);}
.rowbtn .rn{display:flex;align-items:center;gap:var(--s1);font-size:12px;font-weight:400;color:var(--text-muted);}
.chev{color:var(--text-muted);font-size:13px;line-height:1;}

/* ---------- 空队列：页内空态，不 alert ---------- */
.emptybits{margin-top:var(--s3);padding:var(--s4);background:var(--inset);border-radius:var(--r-card);}
.emptybits p{font-size:14px;color:var(--text-soft);}
.emptybits .sbtns{margin-top:var(--s3);}

/* ---------- 弱项诊断：最常错的词（叠在「只练没掌握的」之后） ---------- */
.dd > summary .rn{display:flex;align-items:center;gap:var(--s1);font-size:12px;font-weight:400;color:var(--text-muted);}
.weaklist{padding-bottom:var(--s2);}
.wrow{
  display:flex;align-items:center;gap:var(--s2);
  width:100%;min-height:44px;padding:0 var(--s2);
  background:none;border:0;border-radius:var(--r-ctl);
  color:var(--ink);font-family:inherit;text-align:left;cursor:pointer;
}
.wrow:active{background:var(--inset);}
.wrow .wmain{flex:1;min-width:0;display:flex;align-items:baseline;gap:var(--s2);overflow:hidden;}
.wrow .wja{font-family:var(--font-ja);font-size:14.5px;font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
.wrow .wkana{font-family:var(--font-ja);font-size:12px;color:var(--text-muted);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
.wrow .wbad{flex:none;font-size:12px;color:var(--no);font-variant-numeric:tabular-nums;}
.weak-empty{padding:var(--s4) var(--s2);font-size:13px;line-height:1.65;color:var(--text-soft);}

/* ---------- ④⑤ 折叠区 ---------- */
.dd{margin-top:var(--s3);border-top:1px solid var(--line);}
.dd > summary{
  display:flex;align-items:center;justify-content:space-between;gap:var(--s3);
  min-height:48px;padding:0 var(--s2);list-style:none;cursor:pointer;
  border-radius:var(--r-ctl);
  color:var(--ink);font-size:14.5px;font-weight:600;
}
.dd > summary::-webkit-details-marker{display:none;}
.dd > summary:active{background:var(--inset);}
.dd[open] > summary .chev{transform:rotate(90deg);}

.pieces{padding-bottom:var(--s2);}
/* 篇名行 44px（不是 56：6 行多出的 72px 会把「进度与同步」推出首屏） */
.prow{
  display:flex;align-items:center;gap:var(--s3);
  width:100%;min-height:44px;padding:0 var(--s2);
  background:none;border:0;border-radius:var(--r-ctl);
  color:var(--ink);font-family:inherit;font-size:14.5px;text-align:left;cursor:pointer;
}
.prow:active{background:var(--inset);}
/* 编号印章 28×28：R5 合法位置①，篇色实底 + 白字 */
.stamp{
  flex:none;display:flex;align-items:center;justify-content:center;
  width:28px;height:28px;border-radius:var(--r-tag);
  background:var(--piece);color:var(--on-fill);
  font-size:12px;font-weight:700;font-variant-numeric:tabular-nums;letter-spacing:.02em;
}
/* 「全部混测」的空槽：不是印章。1px 边框只是装饰边界，识别靠「全」字与右侧文案 */
.slot{
  flex:none;display:flex;align-items:center;justify-content:center;
  width:28px;height:28px;border-radius:var(--r-tag);
  border:1px solid var(--line);background:none;
  color:var(--text-muted);font-size:11px;font-weight:600;
}
.prow .nm{flex:1;min-width:0;font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
.prow .nm .ja{font-family:var(--font-ja);font-weight:400;color:var(--text-soft);}
.prow .cnt{flex:none;font-size:12px;color:var(--text-muted);font-variant-numeric:tabular-nums;}
.row--all .nm{font-weight:400;color:var(--text-soft);}

.syncbody{padding:var(--s2) var(--s2) var(--s4);}
.sblock{padding:var(--s3) 0;border-top:1px solid var(--line);}
.sblock:first-child{border-top:0;padding-top:0;}
.stitle{font-size:12px;font-weight:600;letter-spacing:.06em;color:var(--text-muted);}
.sdesc{margin-top:var(--s1);font-size:12.5px;line-height:1.65;color:var(--text-soft);}
.sbtns{display:flex;flex-wrap:wrap;gap:var(--s2);margin-top:var(--s3);}
.sbtn{
  flex:1 1 auto;display:inline-flex;align-items:center;justify-content:center;
  min-height:44px;padding:0 var(--s4);
  border:1px solid var(--line);border-radius:var(--r-ctl);
  background:var(--card);color:var(--ink);
  font-family:inherit;font-size:13.5px;font-weight:600;text-align:center;text-decoration:none;cursor:pointer;
}
.sbtn:active{background:var(--inset);}
.sbtn.brand{border-color:var(--brand);color:var(--brand);}
.sbtn.danger-line{border-color:var(--no);color:var(--no);}
#importArea{
  display:block;width:100%;min-height:84px;margin-top:var(--s3);
  padding:var(--s2) var(--s3);
  border:1px solid var(--line);border-radius:var(--r-ctl);
  background:var(--inset);color:var(--ink);
  font-family:var(--font-num);font-size:12.5px;line-height:1.5;resize:vertical;
}
.smsg{display:none;margin-top:var(--s3);font-size:12.5px;}
.smsg.ok{display:block;color:var(--ok);}
.smsg.bad{display:block;color:var(--no);}
.synced,#syncInfo{margin-top:var(--s3);font-size:12px;color:var(--text-soft);}
.danger{
  width:100%;min-height:44px;margin-top:var(--s2);
  background:none;border:0;border-radius:var(--r-ctl);
  color:var(--no);font-family:inherit;font-size:13.5px;font-weight:600;cursor:pointer;
}
.danger:active{background:var(--no-tint);}
.confirm{margin-top:var(--s2);padding:var(--s3) var(--s4);border:1px solid var(--no);border-radius:var(--r-card);}
.confirm p{font-size:12.5px;line-height:1.65;color:var(--text-soft);}
.confirm .sbtns{margin-top:var(--s3);}

/* ---------- stage：单屏（grid 四行 = 顶栏 / 连对 / 卡片 / 动作区，永不滚动） ---------- */
/* 高度算式：100dvh − env(safe-area-inset-top) − env(safe-area-inset-bottom) − 72
   其中 72 = .wrap 上内边距 16（--s4）+ body 下内边距 56（--s14）；body 上内边距就是 env(sat)。
   这样 documentElement.scrollHeight === innerHeight，页面天然没有可滚的余量。 */
.stage{
  --stage-chrome:calc(var(--s4) + var(--s14) + env(safe-area-inset-top,0px) + env(safe-area-inset-bottom,0px));
  display:none;
  height:calc(100vh - var(--stage-chrome));    /* 不支持 dvh 的浏览器回退 */
  height:calc(100dvh - var(--stage-chrome));
  /* 中间行用 minmax(0,1fr)：卡片 = 剩余高度，任何视口都不会溢出、不会把动作区顶出去。
     固定开销 = 顶栏 52 + 连对行 20 + 上间距 8 + 动作区 64 = 144（答题期页头已隐藏，不参与）。
     按算式推：375×667 → 595−144 = 451；320×568 → 496−144 = 352；
     320×568 且带 Safari 工具栏（dvh≈460）→ 460−72−144 = 244。
     280 的兜底只在「极矮视口」里生效，见文末 @media (max-height:430px) —— 那里同时放开页面滚动，
     否则 280 会把 64px 动作区挤出屏幕。 */
  grid-template-rows:52px auto minmax(0,1fr) 64px;
  overflow:hidden;
}
/* 只在答题期禁页面滚动；结果页/列表页必须能滚，且不能常驻 overflow-x:hidden（会杀课文页吸顶） */
body[data-view="stage"]{overflow:hidden;}
/* 答题期隐藏页面级页头（「复习」+ ←）：一是避免和 stage 自己的 ← 出现两个返回箭头，
   二是页头占 44+12=56px，留着会把动作区顶到首屏之外（高度算式里没算它） */
body[data-view="stage"] .hdr{display:none;}

.stage-top{display:flex;align-items:center;gap:var(--s2);height:52px;}
.stage-top #pos,.stage-top #left{font-size:12.5px;color:var(--text-soft);font-variant-numeric:tabular-nums;white-space:nowrap;}
.stage-top .bar{flex:1;}
.icobtn{
  flex:none;display:inline-flex;align-items:center;justify-content:center;
  width:44px;height:44px;padding:0;
  border:1px solid var(--line-control);border-radius:var(--r-pill);
  background:var(--card);color:var(--text-soft);font-size:18px;line-height:1;cursor:pointer;
}
.icobtn:active{background:var(--inset);}
.streak{display:flex;align-items:center;flex-wrap:wrap;gap:var(--s2);min-height:20px;margin-top:var(--s2);font-size:12px;color:var(--text-soft);}
#streakTxt{white-space:nowrap;}
.dots i{display:inline-block;width:7px;height:7px;border-radius:50%;background:var(--line);margin-right:var(--s1);vertical-align:middle;}
.dots i.on{background:var(--ok);}

/* 卡片：两面用 grid 同格叠放（不再绝对定位），高度由网格单元决定。
   旧写法是 .cardwrap(flex) → .flip(100%) → .inner(100%) → .face（绝对定位铺满）的四层依赖，
   任何一环拿不到确定高度，.inner 就是 0，两个面一起塌成 0 高、文字被裁掉（只剩相对 .cardwrap 定位的 .snd）。
   现在只剩两层高度，末端靠 grid 拉伸，不会再塌。 */
.cardwrap{position:relative;display:block;height:100%;min-height:0;}
.flip{
  /* 也用 grid 撑满：.flip 是 <button>，某些浏览器对 button 内的百分比高度有特殊规则，
     改成 grid 后 .inner 靠拉伸拿高度，不再依赖 % 是否生效 */
  display:grid;grid-template-rows:minmax(0,1fr);
  position:relative;width:100%;height:100%;min-height:0;
  padding:0;border:0;background:none;perspective:1200px;
  font-family:inherit;color:inherit;cursor:pointer;
}
.inner{
  display:grid;
  /* 兜底：即使外层高度链再次出问题，卡片也不会低于 240px（宁可溢出，也不要整片空白） */
  grid-template-rows:minmax(240px,1fr);
  position:relative;width:100%;height:100%;min-height:0;transform-style:preserve-3d;
  transition:transform .5s cubic-bezier(.2,.7,.3,1);
}
.flip.flipped .inner{transform:rotateY(180deg);}
/* 词卡是全站唯二合法投影之一（R6 第 2 类：z 轴上有位移）。
   两面占同一网格单元 → 高度=单元高度，内容超高时只在卡内滚动。 */
.face{
  /* 绝对定位 + 显式宽高：.inner 现在有确定高度（grid 链已修），两面铺满它。
     grid 同格叠放（grid-area）在部分环境不生效，实测改成 absolute+100% 才稳定。 */
  position:absolute; inset:0; width:100%; height:100%;
  display:flex;flex-direction:column;align-items:center;justify-content:center;
  min-height:0;padding:var(--s6) var(--s5) 56px;text-align:center;
  overflow-y:auto;-webkit-overflow-scrolling:touch;
  background:var(--card);border:1px solid var(--line);border-radius:var(--r-card);
  box-shadow:var(--shadow-card);
  backface-visibility:hidden;
}
.face.back{transform:rotateY(180deg);}
.tagline{position:absolute;top:var(--s3);left:var(--s3);font-size:11px;letter-spacing:.1em;color:var(--text-muted);}
/* 篇名 pill：R5 合法位置③（篇色 tint 底 + 篇色字） */
.tagline.pill{
  padding:2px var(--s2);border-radius:var(--r-pill);
  background:var(--piece-tint);color:var(--piece);
  font-weight:600;letter-spacing:.06em;
}
/* .word 用 clamp：320 档不换行，长词（入ってはいけません）自动落到 1.5rem */
.word{font-family:var(--font-ja);font-size:clamp(1.5rem,7.4vw,2rem);font-weight:700;line-height:1.5;letter-spacing:.02em;color:var(--ink);word-break:break-word;}
.kana{font-family:var(--font-ja);font-size:15px;font-weight:400;line-height:1.6;color:var(--text-soft);margin-top:var(--s3);}
.zh{font-family:var(--font-zh);font-size:20px;font-weight:600;line-height:1.6;color:var(--ink);margin-top:var(--s1);}
.hint{position:absolute;bottom:var(--s4);left:0;right:0;font-size:12px;color:var(--text-muted);}
.snd{
  position:absolute;top:var(--s3);right:var(--s3);
  display:flex;align-items:center;justify-content:center;
  width:44px;height:44px;padding:0;
  background:var(--card);border:1px solid var(--line);border-radius:var(--r-pill);cursor:pointer;
}
.snd:active{background:var(--inset);}
.snd svg{width:18px;height:18px;fill:var(--ink);}
/* 退出确认条：盖在卡片内，不用 confirm / 弹层 */
.quitbar{
  position:absolute;left:var(--s3);right:var(--s3);bottom:var(--s3);
  padding:var(--s3) var(--s4);
  background:var(--card);border:1px solid var(--line-strong);border-radius:var(--r-card);
}
.quitbar p{font-size:13px;line-height:1.6;color:var(--text-soft);}
.quitbar .sbtns{margin-top:var(--s2);}

/* 动作区 64px：两个按钮各 52 高，始终可见，不随卡片滚动 */
.actions{display:flex;align-items:center;gap:var(--s3);height:64px;margin:0;}
.actions button{
  flex:1;height:52px;min-height:52px;padding:0 var(--s2);
  border:1px solid var(--line);border-radius:var(--r-ctl);
  background:var(--card);color:var(--ink);
  font-family:inherit;font-size:15px;font-weight:600;cursor:pointer;
}
.actions button:active{transform:scale(.985);}
.actions .no{border-color:var(--no);color:var(--no);background:var(--no-tint);}
.actions .mid{border-color:var(--line-control);color:var(--ink);background:var(--card);}
.actions .yes{border-color:var(--ok);color:var(--ok);background:var(--ok-tint);}
/* 三档后每格只有 ~100px，字距收一点，「想起来了」才不会挤 */
.actions button{font-size:14px;letter-spacing:.02em;}

/* ---------- result ---------- */
.result{display:none;margin-top:var(--s3);padding:var(--s6) var(--s5);text-align:center;background:var(--card);border:1px solid var(--line);border-radius:var(--r-card);}
.score{font-size:44px;font-weight:700;line-height:1.3;color:var(--brand);}
.score small{font-size:16px;font-weight:400;color:var(--text-soft);}
.result p{margin-top:var(--s3);font-size:14px;color:var(--text-soft);}
.result .nextdue{font-size:13px;}
.wronglist{margin-top:var(--s4);text-align:left;font-size:14px;}
.wronglist div{padding:var(--s2) 0;border-bottom:1px dashed var(--line);}
.wronglist div:last-child{border-bottom:0;}
.wronglist b{font-family:var(--font-ja);font-weight:700;}
.wronglist .k{font-size:12.5px;color:var(--text-soft);}
.resultbtns{display:flex;flex-direction:column;gap:var(--s3);margin-top:var(--s5);}
.resultbtns button{
  min-height:48px;padding:var(--s3);
  border:1px solid var(--line);border-radius:var(--r-ctl);
  background:var(--card);color:var(--ink);
  font-family:inherit;font-size:14.5px;font-weight:600;cursor:pointer;
}
.resultbtns button:active{transform:scale(.99);}
.resultbtns .primary{background:var(--brand);border-color:var(--brand);color:var(--on-fill);}
/* 「回到这篇」是链接不是按钮：同样 48px 高、同样描边，但是 a 标签（要带 href 才能新开/返回） */
.resultbtns a.rb{
  display:flex;align-items:center;justify-content:center;
  min-height:48px;padding:var(--s3);
  border:1px solid var(--line-control);border-radius:var(--r-ctl);
  background:transparent;color:var(--ink);
  font-size:14.5px;font-weight:600;text-decoration:none;
}
.resultbtns a.rb:active{background:var(--inset);}
/* 错词条目整条可点，右下角提示回到第几句 */
.wronglist a.wl{display:block;color:inherit;text-decoration:none;}
.wronglist a.wl:active{background:var(--inset);}
.wronglist .wl-go{display:inline-block;margin-top:2px;font-size:11.5px;letter-spacing:.04em;color:var(--brand);}
.resultbtns .primary:active{background:var(--brand-press);}
.empty{padding:var(--s5) var(--s2);text-align:center;font-size:14px;color:var(--text-soft);}

/* ---------- 边界收敛：交互元素用 --line-control（四个表面 3.02–3.47，满足 1.4.11）；
              卡片 / 面板的 1px 装饰线仍用 --line。状态色描边（.actions .no/.yes、.sbtn.brand）特异性更高，不受影响 ---------- */
.back,.sbtn,#importArea,.snd,.actions button,.resultbtns button,.ab-phone input,.ab-phone button{border-color:var(--line-control);}

/* ---------- 320 档：先删后缩 ---------- */
@media (max-width:360px){
  .wrap{padding-left:var(--s3);padding-right:var(--s3);}
  .today{padding:var(--s4);}
  .t-big b{font-size:34px;}
  .actions button{min-height:48px;}
  /* .word 不在这里改字号：clamp(1.5rem,7.4vw,2rem) 的最小值已经负责 320 档，再写死会盖掉 clamp */
}

/* 视口极矮（横屏 / 小窗 / 键盘弹起）：52+20+280+64=416 装不下时，给卡片 280 兜底
   并放开页面滚动 —— 绝不把 64px 动作区裁掉（那样按钮就点不到了） */
@media (max-height:430px){
  body[data-view="stage"]{overflow:auto;}
  .stage{height:auto;min-height:calc(100dvh - var(--stage-chrome));}
  .cardwrap{min-height:280px;}
}

/* ---------- 动效降级 ---------- */
@media (prefers-reduced-motion:reduce){
  .bar i{transition:none;}
  .inner{transition:none;transform:none !important;transform-style:flat;}
  .face{transition:opacity .12s;backface-visibility:visible;}
  .face.back{transform:none !important;opacity:0;}
  .flip.flipped .inner .face.front{opacity:0;}
  .flip.flipped .inner .face.back{opacity:1;}
}
</style>

<script>
if(!window.WorkBuddyCloud){
  var _s=document.createElement('script');
  _s.src='https://cdn.jsdelivr.net/npm/@tencent-ai/workbuddy-cloud-sdk@dev/lib/index.global.js';
  document.head.appendChild(_s);

<script src="content.js"></script>
<script src="cloud.js"></script>
<script src="voice.js"></script>
<script>
/* 词表来自 content.js（全站唯一内容真源）：把 {cat,no} 合成 tag 字段，保持页面渲染契约不变。
   加文章/加词只需改 content.js，这里与首页、阅读目录自动同步。 */
const ARTICLE_BY_ID = {};
APP_DATA.articles.forEach(a => { ARTICLE_BY_ID[a.id] = a; });
const WORDS = APP_DATA.words.map(w => {
  const art = ARTICLE_BY_ID[w.a] || {cat:"",no:""};
  return { ja:w.ja, kana:w.kana, zh:w.zh, tag:art.cat+" "+art.no, a:w.a };
});
const $ = id => document.getElementById(id);
const KEY = 'jp_srs_v2';
const DAY = 86400000;
const STEP_MS = {1: 1*DAY, 2: 3*DAY, 3: 7*DAY, 4: 16*DAY, 5: 35*DAY};   // 35 天档通过才算掌握
const MASTER_AT = 5;   // 对应 35 天间隔：7 天就标「掌握」太早（2026-11-20 从 3 提到 5）
const MAX_SESSION = 20;   // 单次今日复习上限

let SRS = {};
try{ SRS = JSON.parse(localStorage.getItem(KEY) || '{}'); }catch(e){ SRS = {}; }
const saveSRS = ()=>{ try{ localStorage.setItem(KEY, JSON.stringify(SRS)); }catch(e){} };
const rec = w => SRS[w.ja] || {s:0, due:0, n:0, bad:0};
const isMastered = w => rec(w).s >= MASTER_AT;
const isNew = w => rec(w).n === 0;
const isDue = w => !isMastered(w) && rec(w).due <= Date.now();

let queue = [], idx = 0, okCount = 0, wrongList = [], flipped = false;
let curScope = 'due';        // 本轮范围：'due' / 'weak' / 'all' / 篇 id —— 结算时用来给「回到这篇」
let seenCount = new Map();   // 本轮每词出现次数，防重复插入死循环

function refreshDash(){
  const mastered = WORDS.filter(isMastered).length;
  const due = WORDS.filter(isDue).length;
  const newCount = WORDS.filter(isNew).length;
  $('dMastered').textContent = mastered;
  $('dDue').textContent = due;
  $('dNew').textContent = newCount;
  if($('dTotal')) $('dTotal').textContent = WORDS.length;
  if($('allCount')) $('allCount').textContent = WORDS.length + ' 词';
  const barAll = $('masterBar');
  if(barAll) barAll.setAttribute('aria-valuemax', String(WORDS.length));
  $('cDue').textContent = due ? '本轮 ' + Math.min(due, MAX_SESSION) + ' 词' : '';
  $('cWeak').textContent = WORDS.filter(w=>!isMastered(w)).length + ' 词';
  APP_DATA.articles.forEach(function(a){
    const el = $('c'+a.id.toUpperCase());
    if(el) el.textContent = WORDS.filter(w=>w.a===a.id).length + ' 词';
  });
  const sub = $('tSub');
  /* 文案口径（2026-11-19 定：只改措辞、不动判定）：
     dDue 的 isDue 包含新词，所以这里说「可练」而不是「到期」，
     并把其中新词数讲清楚，避免「75 到期 + 75 未开始」的自相矛盾。 */
  if(sub) sub.textContent = due
    ? '约 2 分钟 · 每次最多 ' + MAX_SESSION + ' 个' + (newCount ? ' · 含 ' + newCount + ' 个新词' : '')
    : '今天没有要复习的词，明天再来';
  const fill = $('masterFill');
  if(fill) fill.style.width = Math.round(mastered / WORDS.length * 100) + '%';
  const bar = $('masterBar');
  if(bar) bar.setAttribute('aria-valuenow', String(mastered));
  renderWeak();          // 错词次数会随答题变化，顺手刷新弱项榜
}

function buildScope(scope){
  if(scope === 'due'){
    const list = WORDS.filter(isDue);
    list.sort((a,b)=> rec(a).due - rec(b).due);
    return list.slice(0, MAX_SESSION);          // 每次最多 20 个，剩下的下次继续
  }
  if(scope === 'weak') return WORDS.filter(w=>!isMastered(w));
  if(scope === 'all') return WORDS.slice();
  return WORDS.filter(w=>w.a===scope);
}

const shuffle = arr => { for(let i=arr.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[arr[i],arr[j]]=[arr[j],arr[i]];} return arr; };

// 空队列：页内空态（不用 alert）
function showEmpty(scope){
  const box = $('emptyNote');
  if(!box) return;
  $('emptyTxt').textContent = scope === 'due'
    ? '今天没有到期的词 · 明天再来'
    : '这个范围里暂时没有需要复习的词';
  box.hidden = false;
  if(box.scrollIntoView) box.scrollIntoView({block:'nearest'});
}

/* 视图切换：list / stage / result
   stage 期间给 body 挂 data-view="stage" 禁页面滚动；结果页与列表页恢复普通文档流
   （注意：只在 stage 期加 overflow:hidden，绝不能给 body/.wrap 常驻 overflow-x:hidden） */
function setView(view){
  document.body.setAttribute('data-view', view);
  $('start').style.display = (view === 'list') ? '' : 'none';
  $('stage').style.display = (view === 'stage') ? 'grid' : 'none';
  $('result').style.display = (view === 'result') ? 'block' : 'none';
  if(view !== 'stage'){ const q = $('quitNote'); if(q) q.hidden = true; }
}

/* 队列直投：startGame（按 scope 建队）和弱项单练（单元素数组）共用同一条路径，
   SRS 计分与云端写入完全不变 */
function startQueue(words, scope){
  if(!words.length){ showEmpty(scope || 'due'); return; }
  $('emptyNote').hidden = true;
  curScope = scope || 'due';
  queue = (scope === 'all') ? shuffle(words.slice()) : words.slice();
  idx = 0; okCount = 0; wrongList = []; seenCount = new Map();
  setView('stage');
  render();
}

function startGame(scope){
  startQueue(buildScope(scope), scope);
}

/* 词 → 它第一次出现的句子（用于错词回流）。句子已上移到 content.js，这里直接读数据。 */
function refOf(w){
  const a = ARTICLE_BY_ID[w.a] || {};
  const sents = a.sentences || [];
  const key = String(w.ja).replace(/（.*?）/g,'').replace(/[〜~]/g,'').trim();
  for(let i = 0; i < sents.length; i++){
    if(key && (sents[i].plain || '').indexOf(key) >= 0) return { file: 'article.html?id=' + a.id, no: i + 1 };
  }
  return { file: 'article.html?id=' + a.id, no: 0 };
}

function fmt(ts){
  if(!ts) return '今天';
  const d = new Date(ts), now = new Date();
  const diff = Math.round((new Date(d.getFullYear(),d.getMonth(),d.getDate()) - new Date(now.getFullYear(),now.getMonth(),now.getDate()))/DAY);
  if(diff <= 0) return '今天';
  if(diff === 1) return '明天';
  if(diff < 30) return diff + ' 天后';
  return (d.getMonth()+1) + ' 月 ' + d.getDate() + ' 日';
}

// 翻面：视觉靠 .flipped，无障碍靠 aria-hidden 切换（backface-visibility 只藏视觉，读屏会提前念出答案）
function setFlip(v, announce){
  flipped = !!v;
  $('flip').classList.toggle('flipped', flipped);
  const back = $('faceBack'), front = $('faceFront'), live = $('live');
  if(back) back.setAttribute('aria-hidden', flipped ? 'false' : 'true');
  if(front) front.setAttribute('aria-hidden', flipped ? 'true' : 'false');

    live.textContent = !w ? '' : (flipped
      ? '已翻面。读音 ' + (w.kana || w.ja) + '，意思 ' + w.zh

}

function render(){
  setFlip(false, false);
  const w = queue[idx], r = rec(w);
  $('tagF').textContent = w.tag;

  $('dots').innerHTML = [0,1,2,3,4].map(i=>`<i class="${i < Math.min(r.s,MASTER_AT) ? 'on':''}"></i>`).join('');
  $('streakTxt').textContent = r.s >= MASTER_AT
    ? '已掌握'
    : (r.s === 0 ? '答对一次才开始记周期' : r.s + ' / ' + MASTER_AT + '，再对 ' + (MASTER_AT - r.s) + ' 次进 35 天档');
  $('flip').setAttribute('aria-label', '第 ' + (idx+1) + ' 张，共 ' + queue.length + ' 张。' + w.ja + '。点按显示读音与释义');
}

/* grade: 0 = 忘了 / 1 = 想起来了 / 2 = 很熟 */
function review(grade){
  const w = queue[idx];
  const r = Object.assign({s:0, due:0, n:0, bad:0}, SRS[w.ja] || {});
  r.n += 1;
  if(grade > 0){
    r.s += (grade === 2 ? 2 : 1);
    if(r.s > MASTER_AT) r.s = MASTER_AT;
    r.due = Date.now() + STEP_MS[Math.min(r.s, MASTER_AT)];
    okCount++;
  }else{
    r.s = 0; r.bad += 1; r.due = Date.now();
    wrongList.push(w);
    // 同一次会话里，隔 5 张再考一次（每词最多补考 1 次）
    const c = seenCount.get(w.ja) || 0;
    if(c < 1){
      seenCount.set(w.ja, c + 1);
      const at = idx + 6;
      if(at < queue.length) queue.splice(at, 0, w); else queue.push(w);
    }
  }
  SRS[w.ja] = r; saveSRS();
  pushWord(w);
  idx++;
  if(idx >= queue.length) finish(); else render();
}

function finish(){
  setView('result');
  $('okCount').textContent = okCount;

// ===== 跨设备同步：把进度压进链接 hash =====
const D0 = Date.UTC(2026, 0, 1);
const SYNC_KEY = 'jp_srs_synced_at';

function encodeProgress(){
  const parts = [];
  WORDS.forEach((w, i)=>{
    const r = SRS[w.ja];
    if(!r || !r.n) return;
    const day = Math.max(0, Math.round((r.due - D0) / DAY));
    parts.push(i.toString(36) + '.' + Math.min(r.s || 0, 3) + '.' + day.toString(36));
  });
  return '1.' + parts.join(',');
}

// 合并策略：同一词取"到期时间更晚"的那份，避免旧链接把新进度冲掉
function decodeProgress(raw){
  let str = String(raw || '').trim();
  const hi = str.indexOf('p=');
  if(hi >= 0) str = str.slice(hi + 2);
  str = str.split('&')[0].replace(/^1\./, '');
  if(!str) return 0;
  let applied = 0;
  str.split(',').forEach(t=>{
    const p = t.split('.');
    if(p.length < 3) return;
    const i = parseInt(p[0], 36);
    const sk = parseInt(p[1], 10);
    const d = parseInt(p[2], 36);
    if(!(i >= 0 && i < WORDS.length) || isNaN(sk) || isNaN(d)) return;
    const due = D0 + d * DAY;
    const old = SRS[WORDS[i].ja];
    if(old && old.n && old.due > due) return;   // 本地更新，保留本地
    SRS[WORDS[i].ja] = {s: Math.min(sk, 3), due: due, n: 1, bad: 0};
    applied++;
  });
  return applied;
}

function syncUrl(){
  return location.origin + location.pathname + location.search + '#p=' + encodeProgress();
}

function copyText(txt){
  if(navigator.clipboard && window.isSecureContext){
    return navigator.clipboard.writeText(txt);
  }
  return new Promise((res, rej)=>{
    const ta = document.createElement('textarea');
    ta.value = txt; ta.style.position='fixed'; ta.style.opacity='0';
    document.body.appendChild(ta); ta.focus(); ta.select();
    try{ document.execCommand('copy'); res(); }catch(e){ rej(e); }
    document.body.removeChild(ta);
  });
}

/* 服务端错误是英文原文（invalid_client / failed to fetch …），直接甩给用户等于没说。
   这里翻成"下一步做什么"；认不出来的原样保留，方便排查。 */
function humanErr(e){
  const raw = (e && (e.message || e.error_description || e.error)) || String(e || '');
  const s = raw.toLowerCase();
  if(s.includes('invalid_client') || s.includes('credential is invalid') || s.includes('revoked')){
    return '本站云凭据被服务端拒绝：多半是页面还在用旧缓存。请关掉页面重新打开一次再试。';
  }
  if(s.includes('failed to fetch') || s.includes('networkerror') || s.includes('network request failed')){
    return '连不上云服务，先确认网络，再重试一次。进度仍存在这台手机。';
  }
  if(s.includes('too many') || s.includes('rate limit') || s.includes('频繁')){
    return '发送太频繁，等 1 分钟再试。';
  }
  if(s.includes('expired') || s.includes('invalid code') || s.includes('incorrect') || s.includes('invalid_argument')){
    return '验证码不对或已过期，重新获取一个。';
  }
  if(s.includes('invalid phone') || s.includes('phone_number')){
    return '手机号格式不对，检查后重填。';
  }
  if(s.includes('could not find the table') || s.includes('42p01') || s.includes('does not exist')){
    return '云端数据表还没建好，进度仍然存在这台手机。';
  }
  if(s.includes('42501') || s.includes('permission denied') || s.includes('row-level security')){
    return '云端拒绝了这次访问（权限问题），进度仍然存在这台手机。';
  }
  return raw || '操作失败，请重试。';
}

/* 登录后的显示名。
   坑：user 对象里没有 name 时，早先的写法用 '已登录' 兜底，再拼成「已登录：已登录」。
   这里返回空串表示"没有可显示的名字"，由调用方决定只说「已登录」。
   手机号/邮箱一律打码，不把完整联系方式写到屏幕上（也会进截图）。 */
function whoOf(u){
  if(!u) return '';
  const name = u.name || u.nickname || u.displayName || '';
  if(name) return String(name);
  const phone = u.phone || u.phoneNumber || u.phone_number || '';
  if(phone){ let d = String(phone).replace(/[^\d]/g, ''); if(d.indexOf('86') === 0 && d.length > 11) d = d.slice(2); if(d.length >= 7) return d.slice(0,3) + '****' + d.slice(-4); }
  const mail = u.email || '';
  if(mail && mail.indexOf('@') > 0){ const p = mail.split('@'); return p[0].slice(0,1) + '***@' + p[1]; }
  const un = u.username || '';
  if(un) return String(un);
  return '';
}

async function pullCloud(){
  const st = window.JPCloud && JPCloud.state;
  if(!st || !st.client || !st.session) return;
  try{
    const { data, error } = await st.client.database
      .from('study_progress')
      .select('word_key,streak,due_at,reviews,bad');
    if(error) throw error;
    let applied = 0;
    (data || []).forEach(row=>{
      const due = new Date(row.due_at).getTime();
      const old = SRS[row.word_key];
      const cloudBad = row.bad | 0;               // 累计答错次数，只增不减
      if(old && old.n && old.due > due){
        // 进度以本地为准，但 bad 是累计计数：取大值，避免来回覆盖变小
        if(cloudBad > (old.bad || 0)){ old.bad = cloudBad; applied++; }
        return;
      }
      SRS[row.word_key] = {
        s: Math.min(row.streak | 0, 3),
        due: due,
        n: Math.max(row.reviews | 0, 1),
        bad: Math.max((old && old.bad) || 0, cloudBad)   // pullCloud：Math.max 合并
      };
      applied++;
    });
    if(applied){ saveSRS(); refreshDash(); }
    statusSet('synced', '已同步 · 刚刚', '管理');
    abMsg(applied ? '已从云端同步 ' + applied + ' 个词' : '云端已是最新', 'ok');
  }catch(e){
    abMsg('云端读取失败：' + humanErr(e), 'err');
    statusFail();
  }
}

async function pushAllLocal(){
  const st = window.JPCloud && JPCloud.state;
  if(!st || !st.client || !st.session) return 0;
  const rows = WORDS.filter(function(w){ return (SRS[w.ja] || {}).n > 0; }).map(function(w){
    const r = SRS[w.ja];
    return {
      word_key: w.ja,
      streak: r.s | 0,
      due_at: new Date(r.due).toISOString(),
      reviews: r.n | 0,
      bad: r.bad || 0,                                   // 登录后整批上传也要带上 bad，否则会丢
      updated_at: new Date().toISOString()
    };
  });
  if(!rows.length) return 0;
  try{
    const { error } = await st.client.database
      .from('study_progress')
      .upsert(rows, { onConflict: 'owner_id,word_key' });
    if(error) throw error;
    return rows.length;
  }catch(e){
    abMsg('上传本机进度失败：' + (e && e.message ? e.message : e), 'err');
    statusFail();
    return 0;
  }
}

async function pushWord(w){
  const st = window.JPCloud && JPCloud.state;
  if(!st || !st.client || !st.session) return;
  const r = SRS[w.ja];
  if(!r) return;
  try{
    const { error } = await st.client.database.from('study_progress').upsert({
      word_key: w.ja,
      streak: r.s | 0,
      due_at: new Date(r.due).toISOString(),
      reviews: r.n | 0,
      bad: r.bad || 0,                                   // pushWord：带上累计答错次数
      updated_at: new Date().toISOString()
    }, { onConflict: 'owner_id,word_key' });
    if(error) throw error;
    statusSet('synced', '已同步 · 刚刚', '管理');
    abMsg('已同步到云端', 'ok');
  }catch(e){
    abMsg('同步失败（进度仍保存在本机）：' + (e && e.message ? e.message : e), 'err');
    statusFail();
  }
}

async function deleteCloud(){
  const st = window.JPCloud && JPCloud.state;
  if(!st || !st.client || !st.session) return;
  try{
    const keys = WORDS.map(function(w){ return w.ja; });
    const { error } = await st.client.database.from('study_progress').delete().in('word_key', keys);
    if(error) throw error;
    abMsg('已清空云端记录', 'ok');
  }catch(e){
    abMsg('云端清空失败：' + (e && e.message ? e.message : e), 'err');
    statusFail();
  }
}

// ---- 登录入口 ----
let pendingOtp = null;

$('btnSendCode').onclick = async function(){
  const phone = $('phoneInput').value.trim();
  if(!/^1\d{10}$/.test(phone)){ abMsg('手机号要是 11 位', 'err'); return; }
  const st = window.JPCloud && JPCloud.state;
  if(!st || !st.client){ abMsg('云服务还在加载，稍等几秒再试', 'err'); return; }
  this.disabled = true;
  try{
    const otp = await st.client.auth.signInWithOtp({ phone: phone });
    if(otp.error){ abMsg(humanErr(otp.error), 'err'); return; }
    pendingOtp = otp.data;
    $('codeInput').focus();
    abMsg('验证码已发出，60 秒后可重发', 'ok');
  }catch(e){
    abMsg(humanErr(e), 'err');
  }finally{
    this.disabled = false;
  }
};

$('btnVerify').onclick = async function(){
  const token = $('codeInput').value.trim();
  if(!pendingOtp){ abMsg('请先获取验证码', 'err'); return; }
  if(!token){ abMsg('请输入短信验证码', 'err'); return; }
  const st = window.JPCloud && JPCloud.state;
  if(!st || !st.client){ abMsg('云服务还在加载，稍等几秒再试', 'err'); return; }
  this.disabled = true;
  try{
    const done = await pendingOtp.verify({ token: token });
    if(done.error){ abMsg(humanErr(done.error), 'err'); return; }
    pendingOtp = null;
    $('abPhone').style.display = 'none';
    $('codeInput').value = '';
    const s2 = await st.client.auth.getSession();
    const sess = (s2 && s2.data) || done.data;
    JPCloud.state.session = sess;
    JPCloud.state.user = sess && sess.user;
    renderAuth({ session: sess, user: sess && sess.user, client: st.client, ready: true });
    await pullCloud();
    const pushed = await pushAllLocal();
    if(pushed) abMsg('已登录，并从本机上传 ' + pushed + ' 个词的进度', 'ok');
  }catch(e){
    abMsg(humanErr(e), 'err');
  }finally{
    this.disabled = false;
  }
};

$('btnSignOut').onclick = async function(){
  const st = window.JPCloud && JPCloud.state;
  if(st && st.client){
    try{ await st.client.auth.signOut(); }catch(e){}
  }
  if(window.JPCloud){ JPCloud.state.session = null; JPCloud.state.user = null; }
  renderAuth({ session: null, user: null });
  abMsg('已退出登录，进度仍保存在本机', 'ok');
};

// 监听云服务状态
if(window.JPCloud){
  JPCloud.onChange(function(st){
    renderAuth(st);
    if(st && st.session && st.ready && st.session !== cloudUser){
      cloudUser = st.session;
      pullCloud();
    }
    if(st && !st.session) cloudUser = null;
  });
}else{
  // cloud.js 没加载成功：状态行不能一直停在「检查中…」
  statusSet('idle', '未登录 · 进度只在这台手机', '登录');
}

refreshDash();
showSyncInfo();

// 从课文页进入：?set=a1..a5 直接开始该篇
/* 文章映射从 content.js 派生：ARTICLES[id]=单页链接，NAMES[id]=「分类 编号 · 简称」。 */
const ARTICLES = {}, NAMES = {};
APP_DATA.articles.forEach(function(a){
  ARTICLES[a.id] = 'article.html?id=' + a.id;
  NAMES[a.id] = a.cat + ' ' + a.no + ' · ' + a.short;
});
try{
  const set = new URLSearchParams(location.search).get('set');
  if(set && ARTICLES[set]){
    const back = document.querySelector('.back');
    if(back){ back.href = ARTICLES[set]; back.setAttribute('aria-label', '返回课文'); }
    document.querySelector('.title').textContent = '复习 · ' + NAMES[set];
    startGame(set);
  }
}catch(e){}
